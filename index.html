<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuantVote V2</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0f1117;
  color: #e8ecf1;
  font-family: Arial, sans-serif;
}

main {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

h1 {
  margin-bottom: 5px;
}

h2 {
  margin-top: 0;
}

.sub {
  color: #9aa4b2;
  margin-bottom: 18px;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 10px 16px;
  background: #2d6cdf;
  color: white;
  font-weight: bold;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 12px;
  margin: 15px 0;
}

.card {
  background: #181c24;
  border: 1px solid #2a303b;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
}

.label {
  color: #9aa4b2;
  font-size: 13px;
}

.big {
  font-size: 28px;
  font-weight: bold;
  margin-top: 6px;
}

.muted {
  color: #9aa4b2;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 9px;
  border-bottom: 1px solid #2a303b;
  text-align: left;
}

.indicator {
  display: inline-block;
  min-width: 170px;
  padding: 7px 0;
}

li {
  margin: 7px 0;
}
</style>
</head>

<body>

<main>

<h1>QuantVote V2</h1>

<div class="sub">
Technical Research Dashboard · Kraken Public Data
</div>

<div style="margin-bottom:15px;">
  <button id="refresh">刷新数据</button>
  <span id="status" class="muted"></span>
</div>

<div class="grid">

  <div class="card">
    <div class="label">BTC 价格</div>
    <div id="price" class="big">—</div>
  </div>

  <div class="card">
    <div class="label">1H QuantVote</div>
    <div id="vote" class="big">—</div>
  </div>

  <div class="card">
    <div class="label">1H Score</div>
    <div id="score" class="big">—</div>
  </div>

  <div class="card">
    <div class="label">风险</div>
    <div id="risk" class="big">—</div>
  </div>

</div>

<div class="card">

<h2>多周期</h2>

<table>

<thead>
<tr>
<th>周期</th>
<th>价格</th>
<th>Score</th>
<th>Vote</th>
<th>Trend</th>
<th>RSI</th>
</tr>
</thead>

<tbody id="multi">

<tr>
<td colspan="6">加载中…</td>
</tr>

</tbody>

</table>

</div>

<div class="card">

<h2>1H 指标</h2>

<div id="indicators">
加载中…
</div>

</div>

<div class="card">

<h2>1H 判断依据</h2>

<ul id="reasons">

<li>加载中…</li>

</ul>

</div>

<div class="card">

<h2>方法说明</h2>

<p class="muted">
QuantVote Technical Core V2：
EMA + RSI + MACD + KDJ + Bollinger + Volume。
这是规则化技术分析研究分数，不是价格预测，也不是投资建议。
</p>

</div>

</main>

<script>

const API =
  "https://xue.xilongy41-8bd.workers.dev";

const $ = (id) =>
  document.getElementById(id);

function fmt(value, digits = 2) {

  if (
    value === null ||
    value === undefined ||
    !Number.isFinite(Number(value))
  ) {
    return "—";
  }

  return Number(value).toFixed(digits);
}

async function getAPI(path) {

  const response =
    await fetch(API + path);

  if (!response.ok) {

    throw new Error(
      "HTTP " + response.status
    );

  }

  return response.json();
}

async function loadData() {

  $("status").textContent =
    "正在加载…";

  try {

    const [voteData, multiData] =
      await Promise.all([

        getAPI(
          "/api/vote?symbol=BTCUSD&interval=60"
        ),

        getAPI(
          "/api/multi?symbol=BTCUSD"
        )

      ]);

    const indicators =
      voteData.indicators || {};

    $("price").textContent =
      fmt(voteData.price);

    $("vote").textContent =
      (voteData.vote || "—")
        .toUpperCase();

    $("score").textContent =
      (voteData.score ?? "—") +
      " / " +
      (voteData.maxScore ?? 7);

    $("risk").textContent =
      (voteData.risk || "—")
        .toUpperCase();

    const indicatorList = [

      ["EMA20", indicators.ema20],

      ["EMA50", indicators.ema50],

      ["EMA200", indicators.ema200],

      ["RSI14", indicators.rsi14],

      ["MACD", indicators.macd],

      ["MACD Signal", indicators.macdSignal],

      ["K", indicators.k],

      ["D", indicators.d],

      ["J", indicators.j],

      ["Boll Middle",
       indicators.bollMiddle],

      ["Boll Upper",
       indicators.bollUpper],

      ["Boll Lower",
       indicators.bollLower],

      ["ATR14",
       indicators.atr14],

      ["ATR %",
       indicators.atrPercent],

      ["Volume Ratio",
       indicators.volumeRatio]

    ];

    $("indicators").innerHTML =
      indicatorList
        .map(item =>

          `<span class="indicator">
            <span class="muted">
              ${item[0]}：
            </span>
            <b>
              ${fmt(item[1])}
            </b>
          </span>`

        )
        .join("");

    $("reasons").innerHTML =
      (voteData.reasons || [])
        .map(reason =>
          `<li>${reason}</li>`
        )
        .join("");

    if (
      !voteData.reasons ||
      voteData.reasons.length === 0
    ) {

      $("reasons").innerHTML =
        "<li>暂无数据</li>";

    }

    $("multi").innerHTML =
      (multiData.timeframes || [])
        .map(item => {

          const i =
            item.indicators || {};

          return `
            <tr>

              <td>
                ${item.timeframe}
              </td>

              <td>
                ${fmt(item.price)}
              </td>

              <td>
                ${item.score ?? "—"}
              </td>

              <td>
                ${item.vote ?? "—"}
              </td>

              <td>
                ${i.trend ?? "—"}
              </td>

              <td>
                ${fmt(i.rsi14)}
              </td>

            </tr>
          `;

        })
        .join("");

    $("status").textContent =
      "更新：" +
      new Date().toLocaleString();

  } catch (error) {

    $("status").textContent =
      "加载失败：" +
      error.message;

  }

}

$("refresh").addEventListener(
  "click",
  loadData
);

loadData();

setInterval(
  loadData,
  60000
);

</script>

</body>
</html>
